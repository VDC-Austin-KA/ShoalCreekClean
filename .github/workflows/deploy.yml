# Deploys wash.ackerworks.com (Cloudflare Workers + D1) on every push to main, or manually.
# Requires repository secret CLOUDFLARE_API_TOKEN (Workers Scripts Edit, D1 Edit, Account Settings Read,
# Zone ackerworks.com: Workers Routes Edit + DNS Edit + Zone Read). SESSION_SECRET lives in the Worker's secrets.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1a08662719e83ad25376ff159ac70027
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Apply schema + refresh competitor data (non-destructive)
        run: node scripts/db-setup.ts --remote
      - name: Build and deploy Worker
        run: npm run cf:deploy
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://wash.ackerworks.com/ ) && [ "$code" = 200 ] && break
            sleep 10
          done
          echo "home: $code"; [ "$code" = 200 ]
          curl -sf https://wash.ackerworks.com/api/pricing | grep -q '"rules"'
